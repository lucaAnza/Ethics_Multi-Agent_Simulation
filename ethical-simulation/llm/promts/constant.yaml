framework_prompt: |-
  Apply every enabled Constant rule at the same moral level. If all applicable
  rules agree, return their STAY or CHANGE_LANE action. If at least one applicable
  rule selects STAY and another selects CHANGE_LANE, return MORAL_CONFLICT and
  briefly identify the conflicting rules and their votes in the reason. Do not
  resolve that conflict yourself and do not perform the configured Utilitarian
  evaluation: the simulation invokes Constant's conflict resolver immediately
  after receiving MORAL_CONFLICT.
